name: JSpecify JDK CI tests

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build_jdk:
    name: Build the JSpecify JDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_VERSION: 26
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 26
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: 26
        distribution: 'temurin'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --only-upgrade apt
        sudo apt-get install gcc-10 g++-10 libcups2-dev libasound2-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
    - name: Install jtreg
      run: |
        wget https://builds.shipilev.net/jtreg/jtreg-8.3%2B1.zip -O /tmp/jtreg.zip
        unzip /tmp/jtreg.zip -d /tmp/
    - name: Configure the JDK
      run: bash ./configure --with-jtreg=/tmp/jtreg --disable-warnings-as-errors
    - name: Build the JDK
      run: make jdk

